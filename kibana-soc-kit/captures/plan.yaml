# Catalogue des captures — SPEC §7.2.
#
# Chaque capture déclare : où aller, ce qu'on attend à l'écran, et les éléments
# à annoter. Les repères numérotés sont dessinés par script à partir des boîtes
# englobantes des éléments visés par leur « data-test-subj » : aucune retouche
# manuelle, et une montée de version se rattrape avec « make captures ».
#
# « alt » décrit l'étape, pas l'image : c'est ce que lira une personne qui
# n'accède pas à la capture.

- id: M0-C1
  module: M0
  titre: Discover, ses quatre zones
  chemin: "/app/discover#/?_g=(time:(from:now-7d,to:now))&_a=(index:'formation-logs',query:(language:kuery,query:''))"
  attendre: fieldList
  legende: >-
    Discover sur sept jours de données. Les quatre zones de l'écran à repérer
    avant toute recherche. À ne pas confondre avec les trois repères du module,
    qui sont des questions — où, quand, de quel type — et non des endroits.
  alt: >-
    L'écran Discover. Le sélecteur de source de données est en haut à gauche,
    la barre de requête au centre en haut, le sélecteur de plage de temps à sa
    droite, et la liste des champs occupe la colonne de gauche.
  reperes:
    - cible: discover-dataView-switch-link
      note: La source de données interrogée
    - cible: queryInput
      note: La barre de requête
    - cible: dateRangePickerControlButton
      note: La plage de temps
    - cible: fieldList
      note: Les champs disponibles et leurs valeurs

- id: M0-C2
  module: M0
  titre: Quinze minutes ne suffisent pas
  chemin: "/app/discover#/?_g=(time:(from:now-15m,to:now))&_a=(index:'formation-logs',query:(language:kuery,query:''))"
  attendre: discoverNoResults
  # Le jeu de données se termine à l'instant du chargement : les quinze
  # dernières minutes n'en sont vides qu'une fois ce délai écoulé.
  age_minimal_donnees_min: 20
  legende: >-
    La même vue, sur la plage de temps par défaut de Kibana : l'écran est vide
    alors que les données sont là.
  alt: >-
    Discover affiche « Aucun résultat ne correspond à vos critères de
    recherche » parce que la plage de temps ne couvre que les quinze dernières
    minutes, alors que le jeu de données s'étend sur sept jours.
  reperes:
    - cible: dateRangePickerControlButton
      note: La plage de temps, trop courte
    - cible: discoverNoResultsTimefilter
      note: Kibana suggère lui-même d'élargir la plage

- id: M1-C1
  module: M1
  titre: Une requête KQL et son résultat
  chemin: "/app/discover#/?_g=(time:(from:now-7d,to:now))&_a=(index:'formation-logs',query:(language:kuery,query:'event.code%20:%20%224625%22'))"
  attendre: discoverQueryHits
  legende: >-
    Une requête KQL filtrant les échecs d'ouverture de session Windows, et le
    nombre de documents qu'elle retient.
  alt: >-
    La barre de requête contient « event.code : "4625" ». Kibana affiche
    au-dessus de la table le nombre de documents retenus par cette requête.
  reperes:
    - cible: queryInput
      note: La requête saisie
    - cible: discoverQueryHits
      note: Le nombre de résultats

- id: M2-C1
  module: M2
  titre: Lens demande la forme avant les données
  chemin: "/app/lens#/?_g=(time:(from:now-7d,to:now))"
  attendre: lnsWorkspace
  gestes:
    - clic: lnsChartSwitchPopover
      attente_ms: 2500
  legende: >-
    L'éditeur Lens, son sélecteur de type de graphique ouvert. Chaque entrée
    dit à quoi sert la forme.
  alt: >-
    L'éditeur Lens. Le sélecteur de type de graphique est ouvert en haut du
    panneau de configuration et déroule la liste des formes disponibles ;
    la colonne de gauche liste les champs, et l'espace de travail central
    attend qu'on y dépose des dimensions.
  reperes:
    - cible: lnsChartSwitchPopover
      note: Le type de graphique, choisi avant les données
    - cible: lnsDataPanelWrapper
      note: Les champs disponibles
    - cible: lnsWorkspace
      note: L'espace de travail

- id: M3-C1
  module: M3
  titre: Un tableau de bord répond à une question
  # PLAGE VOLONTAIREMENT VIDE (il y a dix ans). La capture doit montrer la
  # STRUCTURE d'un tableau de bord — disposition, titres formulés en questions,
  # place de l'indicateur — et surtout PAS ses valeurs : ce sont celles du
  # corrigé, donc les réponses de douze exercices. Une image ne passe sous
  # aucun garde de fuite : c'est au plan de capture de ne pas les montrer.
  chemin: "/app/dashboards#/view/kit-soc-sante-collecte?_g=(time:(from:now-10y,to:now-9y))"
  espace: corriges
  attendre: embeddablePanel
  legende: >-
    La structure d'un tableau de bord de santé : l'indicateur qui décide si
    l'on continue à lire en haut à gauche, puis la série temporelle, puis le
    tableau. Les compteurs affichent 0 et les autres panneaux « Résultat
    introuvable », à dessein : la plage de temps est forcée dix ans en arrière
    pour cette capture, là où le jeu de données n'a rien. Ce sont les titres
    et la disposition qu'il faut lire ici, pas les chiffres. Le rouge de
    « Sources actives (1 h) » est la coloration conditionnelle du panneau, qui
    réagit à ce zéro : rien n'est en panne.
  alt: >-
    Un tableau de bord intitulé « Santé de la collecte », affiché sur une plage
    de temps réglée dix ans en arrière, où le jeu de données ne contient aucun
    document. On y lit la disposition de ses cinq panneaux et leurs titres,
    tous formulés en questions. En haut à gauche, « Combien d'événements sur la
    plage de temps ? » : un compteur « Événements collectés » qui affiche 0. À sa
    droite, « Combien de sources ont émis dans la dernière heure ? » : un
    compteur « Sources actives (1 h) » qui affiche 0 et dont tout le fond passe
    au rouge, par coloration conditionnelle, parce que ce compte est nul.
    Encore à droite, « Le volume de chaque source tient-il dans le temps ? »,
    et en dessous à gauche, « Quand chaque source a-t-elle émis pour la
    dernière fois ? » : ces deux panneaux affichent « Résultat introuvable ».
    Sur toute la largeur du bas, « Le rythme horaire de la collecte est-il
    régulier ? » : une courbe plate à zéro sur douze mois.
  reperes:
    - cible: dashboardPanelTitle
      note: Le titre d'un panneau énonce la question
    - cible: dateRangePickerControlButton
      note: La plage forcée pour cette capture, hors des données

- id: M4-C1
  module: M4
  titre: L'écran de l'analyste de permanence
  # Même raison : plage vide. Les valeurs de cet écran sont les réponses de
  # M2-E2, M3-E5, M4-E2 et M4-E4.
  chemin: "/app/dashboards#/view/kit-soc-vue-ids?_g=(time:(from:now-10y,to:now-9y))"
  espace: corriges
  attendre: embeddablePanel
  legende: >-
    L'écran de l'analyste de permanence, montré sans données : on ne retient
    ici que l'ordre des panneaux et la façon dont chaque titre pose une
    question. La plage de temps est forcée dix ans en arrière pour cette
    capture, là où le jeu de données n'a rien.
  alt: >-
    Un tableau de bord intitulé « Vue IDS », affiché sur une plage de temps
    réglée dix ans en arrière, où le jeu de données ne contient aucun document.
    L'écran compte huit panneaux ; la fenêtre en laisse voir SEPT, tous
    formulés en questions. En haut à gauche, « Combien d'alertes sur la plage
    de temps ? » : un compteur « Alertes IDS » qui affiche 0 ; à sa droite,
    « Combien de signatures distinctes ? » : un compteur « Signatures
    distinctes » qui affiche 0. Viennent ensuite « Comment les alertes se
    répartissent-elles par gravité ? », « Comment la gravité évolue-t-elle au
    fil du temps ? », « Quelles sources déclenchent le plus d'alertes ? »,
    « Quelles signatures se déclenchent le plus ? » et « Quelles sont les
    dernières alertes reçues ? », qui affichent tous « Résultat introuvable ».
    Le huitième panneau, « Quelles destinations sont les plus visées ? », est
    sous le bas de la fenêtre et n'apparaît pas.
  reperes:
    - cible: dashboardPanelTitle
      note: Chaque panneau répond à une question

- id: M5-C1
  module: M5
  titre: Les objets enregistrés, et leur export
  chemin: "/app/management/kibana/objects"
  attendre: savedObjectsTable
  legende: >-
    La table des objets enregistrés : c'est d'ici que part un export ndjson, et
    c'est ici qu'un import se déclare.
  alt: >-
    La page « Objets enregistrés » de la gestion de la Suite. Un tableau liste
    les tableaux de bord, visualisations et vues de données du Space, avec leur
    type ; un bouton d'import se trouve au-dessus du tableau.
  reperes:
    - cible: savedObjectSearchBar
      note: De quoi retrouver un objet parmi des centaines
    - cible: importObjects
      note: L'import d'un ndjson venu d'un autre Space

- id: M1-C2
  module: M1
  titre: Une syntaxe Lucene tapée en KQL
  chemin: "/app/discover#/?_g=(time:(from:now-7d,to:now))&_a=(index:'formation-logs',query:(language:kuery,query:'destination.port%20:%20%5B1025%20TO%20*%5D'))"
  attendre: discoverErrorCalloutTitle
  legende: >-
    La syntaxe de plage de Lucene, tapée dans une barre réglée sur KQL. Kibana
    refuse, et le dit — contrairement à « _exists_ », qui ne dit rien.
  alt: >-
    La barre de requête de Discover contient « destination.port : [1025 TO *] »,
    une syntaxe qui appartient à Lucene. À la place des résultats, Kibana
    affiche un encadré d'erreur intitulé « Impossible d’extraire les résultats
    de recherche ».
  reperes:
    - cible: queryInput
      note: La syntaxe Lucene, tapée en KQL
    - cible: discoverErrorCalloutTitle
      note: Kibana refuse, et l'annonce
